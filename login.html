<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>
</head>

<body>

    <center>

        <h2>User Login</h2>

        <form>

            <table cellpadding="10">

                <tr>
                    <td>Username :</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>Password :</td>
                    <td><input type="password"></td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Login">
                        <input type="reset" value="Cancel">
                    </td>
                </tr>

            </table>

        </form>

    </center>

</body>

</html>
